<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maple Market evidence status</title></head>
<body>
  <main>
    <h1>Maple Market evidence status</h1>
    <p id="state">Loading the current public evidence manifest.</p>
    <p>See the <a href="index.html">complete evidence gallery</a>.</p>
  </main>
  <script>
    fetch('provenance.json').then(response => response.json()).then(data => {
      document.querySelector('#state').textContent = `${data.captures.length} public-safe captures, updated ${new Date(data.updatedAt).toLocaleString()}.`;
    }).catch(() => { document.querySelector('#state').textContent = 'The evidence manifest is unavailable.'; });
  </script>
</body>
</html>
